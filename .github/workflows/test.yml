name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch. Without this, a busy branch queues
# runs nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The unit tier is a separate job so it reports in about a minute. A single
  # job that runs everything gives the same verdict twenty minutes later, and
  # people stop waiting for it.
  unit:
    name: Unit tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./test/...
          go vet -tags=e2e ./test/...

      - name: Unit tests
        run: go test -race -timeout=60s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pin BOTH the action major and the golangci-lint version.
      #
      # `version: latest` is a trap here: the released binary is built with
      # whatever Go the golangci-lint maintainers used, and golangci-lint
      # refuses to run when that is OLDER than the `go` directive in go.mod:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.25.0)
      #
      # So a repo can be lint-clean locally and red in CI purely because of
      # who built the binary. Pinning makes the pairing explicit and reviewable.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  integration:
    name: Integration tier
    runs-on: ubuntu-latest
    # GitHub's ubuntu runners ship a working Docker daemon, which is what
    # testcontainers needs. Nothing else has to be provisioned.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: go test -tags=integration -race -timeout=10m ./test/integration/...

  e2e:
    name: E2E tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: E2E tests
        run: go test -tags=e2e -timeout=10m ./test/e2e/...

  # A single required check to protect the branch with, so the branch rule does
  # not have to be edited every time a job is added or renamed.
  all-green:
    name: All tiers green
    runs-on: ubuntu-latest
    needs: [unit, lint, integration, e2e]
    if: always()
    steps:
      - name: Fail if any tier failed or was skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "tier results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required tier did not pass: $results"
              exit 1
            fi
          done
