version: "2"

run:
  timeout: 5m
  # Without this, every linter silently skips the integration and e2e files,
  # and a clean report means "we checked two thirds of the suite".
  build-tags:
    - integration
    - e2e

linters:
  enable:
    - errcheck      # an unchecked error is the most common Go bug
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose     # an unclosed HTTP body leaks a connection per request
    - errorlint     # catches err == ErrFoo where errors.Is is required
    - noctx         # catches http.Get with no context
    - testifylint
    - thelper       # requires t.Helper() in helpers, so failures point at the caller
    - tparallel     # catches t.Parallel() misuse in subtests

  exclusions:
    rules:
      # Test files legitimately ignore errors in cleanup paths.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
